<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mille Bornes Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;overflow-x:hidden;overflow-y:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes glow{0%,100%{box-shadow:0 0 5px rgba(74,144,217,0.3)}50%{box-shadow:0 0 20px rgba(74,144,217,0.6)}}
@keyframes cardDeal{from{opacity:0;transform:translateY(-30px) rotate(-5deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
button{cursor:pointer;border:none;font-family:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:10px 20px;transition:all .25s cubic-bezier(.4,0,.2,1)}
button:active{transform:scale(0.93)}
button:hover{filter:brightness(1.1)}
input{font-family:inherit;font-size:16px;padding:10px 14px;border:2px solid rgba(74,144,217,0.3);border-radius:8px;background:rgba(22,33,62,0.8);color:#fff;outline:none;width:100%;transition:border-color .3s}
input:focus{border-color:#4A90D9;box-shadow:0 0 15px rgba(74,144,217,0.2)}
.screen{display:none;flex-direction:column;align-items:center;min-height:100vh;padding:20px;width:100%}
.screen.active{display:flex;animation:fadeIn .4s ease}
h1{font-size:28px;margin-bottom:5px;text-align:center}
.btn-primary{background:linear-gradient(135deg,#4A90D9,#357ABD);color:#fff;box-shadow:0 4px 15px rgba(74,144,217,0.3)}
.btn-primary:disabled{background:#444;box-shadow:none;cursor:not-allowed}
.btn-success{background:linear-gradient(135deg,#2ECC71,#27AE60);color:#fff;box-shadow:0 4px 15px rgba(46,204,113,0.3)}
.btn-gold{background:linear-gradient(135deg,#F39C12,#E67E22);color:#fff}
.btn-outline{background:transparent;border:2px solid #4A90D9;color:#4A90D9}
.btn-small{padding:6px 12px;font-size:12px}
.lobby-card{background:rgba(22,33,62,0.9);backdrop-filter:blur(10px);border-radius:20px;padding:30px;width:100%;max-width:420px;text-align:center;border:1px solid rgba(74,144,217,0.2);animation:slideUp .5s ease;box-shadow:0 10px 40px rgba(0,0,0,0.3)}
.lobby-card .logo{font-size:56px;margin-bottom:10px;animation:pulse 2s infinite}
.lobby-card .subtitle{color:#888;margin-bottom:20px;font-size:14px}
.lobby-card .or{color:#555;margin:15px 0;font-size:13px}
.room-code{font-size:40px;font-weight:800;letter-spacing:8px;background:rgba(15,52,96,0.8);padding:15px;border-radius:12px;margin:10px 0;font-family:monospace;color:#4A90D9;border:1px solid rgba(74,144,217,0.2)}
.room-code-hint{color:#888;font-size:12px;cursor:pointer;display:block;transition:color .3s}
.room-code-hint:hover{color:#4A90D9}
.player-list{width:100%;max-width:420px;margin-bottom:15px}
.player-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(15,52,96,0.6);border-radius:10px;margin-bottom:5px;animation:fadeIn .3s ease}
.player-item .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4A90D9,#357ABD);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.player-item .nm{flex:1;font-weight:500}
.player-item .hb{font-size:10px;background:linear-gradient(135deg,#F39C12,#E67E22);color:#000;padding:2px 7px;border-radius:4px;font-weight:600}
.waiting-info{color:#888;font-size:13px;text-align:center;margin:8px 0}
.waiting-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.game-container{width:100%;max-width:520px;display:flex;flex-direction:column;height:100vh}
.game-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(15,52,96,0.8);font-size:12px;flex-shrink:0;border-bottom:1px solid rgba(74,144,217,0.15)}
.game-top .turn{color:#2ECC71;font-weight:600;animation:pulse 1.5s infinite}
.game-top .turn.wait{color:#F39C12;animation:none}
.status-table{width:100%;padding:4px 8px;flex-shrink:0}
.st-row{display:grid;grid-template-columns:1fr 60px 70px 50px;gap:3px;padding:3px 6px;border-radius:6px;margin-bottom:2px;font-size:11px;align-items:center}
.st-row.header{color:#888;font-size:9px;text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,0.2)}
.st-row.cur{background:rgba(243,156,18,0.1);border:1px solid rgba(243,156,18,0.3)}
.st-row.me{background:rgba(46,204,113,0.08)}
.st-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-dist{font-weight:700;color:#4A90D9;text-align:right}
.st-status{text-align:center;font-size:10px}
.st-status .s{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px}
.st-status .s.st{background:#D94A4A;animation:shake .3s}
.st-status .s.sf{background:#2ECC71}
.st-status .s.sl{background:#E67E22}
.st-status .s.sp{background:#F39C12;color:#000}
.st-status .s.sr{background:#333;color:#888}
.st-cards{text-align:center;color:#888;font-size:10px}
.board{flex:1;display:flex;flex-direction:column;padding:6px 10px;overflow:hidden}
.pinfo{background:rgba(22,33,62,0.8);border-radius:12px;padding:10px 14px;flex-shrink:0;border:1px solid rgba(74,144,217,0.15)}
.pit{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pinm{font-weight:700;font-size:15px}
.pid{font-size:22px;font-weight:800;color:#4A90D9;transition:all .3s}
.pid span{font-size:13px;color:#888;font-weight:400}
.pis{display:flex;gap:4px;flex-wrap:wrap}
.pis .tag{font-size:10px;padding:2px 7px;border-radius:4px;background:#333;animation:fadeIn .3s ease}
.pis .th{background:#D94A4A;color:#fff}
.pis .ts{background:#F39C12;color:#000}
.pis .tsp{background:#E67E22;color:#fff}
.lmove{text-align:center;padding:4px;color:#aaa;font-size:12px;min-height:22px;font-style:italic;flex-shrink:0;animation:fadeIn .3s ease}
.handarea{background:rgba(15,52,96,0.8);border-radius:12px 12px 0 0;padding:5px 4px;flex-shrink:0;border-top:1px solid rgba(74,144,217,0.15)}
.hand{display:flex;gap:5px;overflow-x:auto;padding:4px;min-height:72px;align-items:center}
.handempty{text-align:center;padding:12px;color:#555;font-size:12px;width:100%}
.card{flex-shrink:0;width:62px;height:84px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);border:2px solid transparent;padding:3px;user-select:none;animation:cardDeal .3s ease}
.card:hover{transform:translateY(-8px);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
.card:active{transform:scale(0.92)}
.card.sel{border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,0.3),0 8px 25px rgba(0,0,0,0.3);transform:translateY(-12px)}
.card .ci{font-size:18px;margin-bottom:1px}
.card .cn{text-align:center;line-height:1.2;font-size:9px;word-break:break-word}
.card .cv{font-size:14px;font-weight:800}
.card.dist{background:linear-gradient(135deg,#1a3a6e,#2a5ab8);border-color:#4A90D9;animation:cardDeal .3s ease,glow 2s infinite}
.card.haz{background:linear-gradient(135deg,#6e1a1a,#b82a2a);border-color:#D94A4A}
.card.rem{background:linear-gradient(135deg,#1a6e1a,#2ab82a);border-color:#2ECC71}
.card.safe{background:linear-gradient(135deg,#6e5a1a,#b89a2a);border-color:#F39C12}
.ga{display:flex;gap:6px;padding:5px 10px 10px;background:rgba(15,52,96,0.8);flex-shrink:0}
.ga button{flex:1;font-size:14px;padding:10px}
.endb{background:linear-gradient(135deg,#D94A4A,#C0392B);color:#fff}
.cam,.target-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.cam .c,.target-overlay .c{background:linear-gradient(135deg,#162447,#1a3a6e);border:2px solid rgba(74,144,217,0.4);border-radius:16px;padding:20px;text-align:center;min-width:180px;animation:slideUp .3s ease;box-shadow:0 10px 40px rgba(0,0,0,0.4)}
.cam .ci,.target-overlay .ci{font-size:48px}
.cam .cn,.target-overlay .cn{font-size:16px;margin:8px 0 4px;color:#ddd;font-weight:700}
.cam .ct,.target-overlay .ct{font-size:13px;color:#aaa;margin-bottom:12px}
.cam .ab,.target-overlay .ab{display:flex;flex-direction:column;gap:8px;width:100%}
.cam .ab button,.target-overlay .ab button{font-size:14px;padding:10px;border-radius:8px;border:none;cursor:pointer;font-weight:600;transition:all .15s}
.cam .ab button:active,.target-overlay .ab button:active{transform:scale(0.95)}
.cam .ab .play,.target-overlay .ab .play{background:linear-gradient(135deg,#2ECC71,#27AE60);color:#fff}
.cam .ab .play:disabled,.target-overlay .ab .play:disabled{background:#444;color:#666;cursor:not-allowed}
.cam .ab .disc,.target-overlay .ab .disc{background:linear-gradient(135deg,#E67E22,#D35400);color:#fff}
.cam .ab .cancel,.target-overlay .ab .cancel{background:#555;color:#ccc}
.target-overlay h3{margin-bottom:15px;color:#F39C12}
.target-opp{background:rgba(22,33,62,0.9);padding:12px 20px;border-radius:10px;margin:4px;font-size:15px;font-weight:600;min-width:140px;text-align:center;transition:all .2s}
.target-opp:hover{background:rgba(15,52,96,0.9);transform:scale(1.03)}
.target-opp.disabled{opacity:0.4;cursor:not-allowed;transform:none}
.target-cancel{background:#555;margin-top:12px;padding:8px 20px;border-radius:6px;font-size:13px;color:#fff}
.wname{font-size:24px;color:#F39C12;margin-bottom:20px}
.fscores{width:100%;max-width:420px;margin-bottom:20px}
.fscores .r{display:flex;justify-content:space-between;padding:10px 16px;background:rgba(22,33,62,0.8);border-radius:8px;margin-bottom:5px;animation:fadeIn .3s ease}
.fscores .r:first-child{background:rgba(15,52,96,0.8);border:1px solid #F39C12}
.fscores .r .pos{color:#888;font-weight:600;min-width:20px}
.fscores .r:first-child .pos{color:#F39C12}
.err{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#D94A4A,#C0392B);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;z-index:200;display:none;max-width:90%;text-align:center;box-shadow:0 5px 20px rgba(217,74,74,0.4);animation:fadeIn .3s ease}
@media(min-width:600px){
  .card{width:70px;height:92px}.card .ci{font-size:22px}.card .cn{font-size:10px}.card .cv{font-size:16px}
  .st-row{grid-template-columns:1fr 80px 120px 50px;font-size:12px}
}
@media(max-width:380px){
  .card{width:54px;height:74px}.card .ci{font-size:15px}.card .cn{font-size:8px}.card .cv{font-size:12px}
  .room-code{font-size:28px;letter-spacing:5px}
  .st-row{grid-template-columns:1fr 50px 60px 40px;font-size:10px}
}
</style>
</head>
<body>

<div id="err" class="err"></div>

<div id="lobby" class="screen active">
  <div class="lobby-card">
    <div class="logo">🚗</div>
    <h1>Mille Bornes Online</h1>
    <p class="subtitle">2 à 8 joueurs • Jeu de cartes multijoueur</p>
    <input id="name" placeholder="Ton pseudo" maxlength="16" style="margin-bottom:12px">
    <button class="btn-primary" id="create-btn" style="width:100%;padding:14px">🏁 Créer une partie</button>
    <div class="or">— ou —</div>
    <input id="jcode" placeholder="Code de la partie" maxlength="4" style="text-transform:uppercase;text-align:center;font-weight:700;letter-spacing:4px;margin-bottom:8px">
    <button class="btn-success" id="join-btn" style="width:100%;padding:14px">🚀 Rejoindre</button>
  </div>
</div>

<div id="waiting" class="screen">
  <h1>🚗 Partie créée</h1>
  <p style="color:#888;font-size:14px">Partage ce code :</p>
  <div class="room-code" id="rcode">----</div>
  <span class="room-code-hint" id="copyhint">📋 Copier</span>
  <div class="player-list" id="wlist"></div>
  <p class="waiting-info" id="winfo">En attente...</p>
  <div class="waiting-actions">
    <button class="btn-primary" id="start-btn" disabled>🏁 Lancer</button>
    <button class="btn-outline" id="leave-btn">Quitter</button>
  </div>
</div>

<div id="game" class="screen">
    <div class="game-container">
      <div class="game-top">
        <span>🚗 Mille Bornes</span>
        <span class="turn" id="turn">En attente...</span>
        <span id="status-badge" style="font-size:10px;color:#888"></span>
      </div>
      <div class="status-table" id="status-table"></div>
      <div class="board">
      <div class="pinfo">
        <div class="pit">
          <span class="pinm" id="sname">Toi</span>
          <span class="pid" id="sdist">0 <span>km</span></span>
        </div>
        <div class="pis" id="sstatus"></div>
      </div>
      <div class="lmove" id="lmove"></div>
      <div style="flex:1;min-height:0"></div>
    </div>
    <div class="handarea">
      <div class="hand" id="hand"></div>
    </div>
    <div class="ga">
      <button class="endb" id="endb">⏭ Passer</button>
    </div>
  </div>
</div>

<div id="results" class="screen">
  <div style="text-align:center;padding:40px 20px;width:100%;max-width:500px">
    <div style="font-size:64px;margin-bottom:10px">🏆</div>
    <h1>Partie terminée !</h1>
    <div class="wname" id="wname">Vainqueur</div>
    <div class="fscores" id="fscores"></div>
    <button class="btn-primary" id="replay-btn" style="margin-top:10px;padding:14px 40px">🔄 Revenir au salon</button>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const MAX_PLAYERS = 8;
const CARD_NAMES = {
  dist:{25:'25km',50:'50km',75:'75km',100:'100km',200:'200km'},
  haz:{accident:'Accident',flat_tire:'Crevaison',out_of_gas:'Panne',speed_limit:'Limitation',stop:'Feu Rouge'},
  rem:{repair:'Réparation',spare_tire:'Roue secours',gasoline:'Essence',end_speed:'Fin limite',go:'Feu Vert'},
  safe:{driving_ace:'As du volant',puncture_proof:'Increvable',fuel_tank:'Réservoir',emergency_vehicle:'Prioritaire'}
};
const HI = {accident:'💥',flat_tire:'🔧',out_of_gas:'⛽',speed_limit:'🚦',stop:'🔴'};
const SI = {driving_ace:'🏆',puncture_proof:'🛡️',fuel_tank:'🛢️',emergency_vehicle:'🚨'};

let ws=null,pId='',myName='',myRoom='',isHost=false;
let gs=null;
const S = s=>[lobby,waiting,game,results].forEach(e=>e.classList.toggle('active',e.id===s));
const E = m=>{errEl.textContent=m;errEl.style.display='block';setTimeout(()=>errEl.style.display='none',3500)};
const gn = ()=>['Alexis','Camille','Jordan','Morgan','Louise','Hugo','Emma','Lucas','Léa','Nathan','Tom','Jade'][Math.floor(Math.random()*12)]+Math.floor(Math.random()*100);
const gc = ()=>{let c='';for(let i=0;i<4;i++)c+=String.fromCharCode(65+Math.floor(Math.random()*26));return c};
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dn = c=>{if(c.t==='dist')return c.v+'km';const n=CARD_NAMES[c.t];return n&&n[c.s]?n[c.s]:'?'};
const ci = c=>{if(c.t==='dist')return'🛣️';if(c.t==='haz')return HI[c.s]||'⚠️';if(c.t==='rem')return{repair:'🔩',spare_tire:'🛞',gasoline:'⛽',end_speed:'✅',go:'🟢'}[c.s]||'🔧';return SI[c.s]||'🛡️'};
const cc = c=>{if(c.t==='dist')return'dist';if(c.t==='haz')return'haz';if(c.t==='rem')return'rem';return'safe'};
const hm = (s,safe)=>(s==='accident'&&safe==='driving_ace')||(s==='flat_tire'&&safe==='puncture_proof')||(s==='out_of_gas'&&safe==='fuel_tank')||(s==='speed_limit'&&safe==='emergency_vehicle')||(s==='stop'&&safe==='emergency_vehicle');

const lobby=document.getElementById('lobby'),waiting=document.getElementById('waiting');
const game=document.getElementById('game'),results=document.getElementById('results');
const errEl=document.getElementById('err');

// ===================== WEBSOCKET =====================
function connect(){
  const isCapacitor = typeof window.Capacitor !== 'undefined';
  let url = localStorage.getItem('srvUrl');
  if (!url) {
    if (isCapacitor) {
      url = 'wss://mille-bornes-online-1.onrender.com';
    } else {
      const isSecure = location.protocol === 'https:' || location.protocol === 'file:';
      const proto = isSecure ? 'wss:' : 'ws:';
      const host = location.host || 'localhost:3000';
      url = proto + '//' + host;
    }
  } else {
    const isSecure = url.includes('render.com') || url.includes('heroku');
    url = (isSecure ? 'wss:' : 'ws:') + '//' + url;
  }
  ws = new WebSocket(url);
  ws.onopen = ()=>console.log('connecté');
  ws.onmessage = e=>{
    try{
      const m = JSON.parse(e.data);
      handle(m);
    }catch(x){}
  };
  ws.onclose = ()=>{
    if(game.classList.contains('active')||waiting.classList.contains('active')){
      E('Connexion perdue !');
      S('lobby');
    }
  };
}

function handle(m){
  switch(m.type){
    case 'connected': pId=m.playerId; break;
    case 'room_created': myRoom=m.roomId; isHost=true; S('waiting'); renderW(m.players); break;
    case 'room_joined': myRoom=m.roomId; isHost=false; S('waiting'); renderW(m.players); break;
    case 'player_joined': if(m.players)renderW(m.players); break;
    case 'game_start': gs=m.state; selCard=null; S('game'); renderG(); break;
    case 'game_update': gs=m.state; renderG(); break;
    case 'game_over': gs=m.state; showR(m.winner); break;
    case 'error': E(m.message); break;
    case 'player_disconnected': if(gs&&gs.players)gs.players.forEach(p=>{if(p.id===m.playerId)p.isConnected=false}); renderG(); break;
  }
}

// ===================== LOBBY =====================
function renderW(players){
  const list=document.getElementById('wlist');
  document.getElementById('rcode').textContent=myRoom;
  document.getElementById('start-btn').style.display=isHost?'inline':'none';
  document.getElementById('start-btn').disabled=true;
  document.getElementById('start-btn').textContent='🏁 En attente...';
  if(players){
    list.innerHTML=players.map(p=>`<div class="player-item"><div class="av">${(p.name||'?')[0].toUpperCase()}</div><span class="nm">${p.name}</span>${p.isHost?'<span class="hb">HÔTE</span>':''}</div>`).join('');
    const c=players.length;
    document.getElementById('winfo').textContent=c+'/'+MAX_PLAYERS+' joueurs'+(c>=2?' — L\'hôte peut lancer':'');
    if(isHost&&c>=2){document.getElementById('start-btn').disabled=false;document.getElementById('start-btn').textContent='🏁 Lancer ('+c+' joueurs)';}
  }
}

// ===================== GAME UI =====================
function renderG(){
  if(!gs||!gs.players)return;
  const me=gs.players.find(p=>p.id===pId);
  if(!me)return;
  const ot=gs.players.filter(p=>p.id!==pId);
  const ti=document.getElementById('turn');
  if(gs.phase==='finished'){ti.textContent='🏁 Terminé';ti.className='turn';}
  else{
    const cur=gs.players[gs.currentPlayer];
    if(cur&&cur.id===pId){ti.textContent='🎯 À TON TOUR';ti.className='turn';}
    else{ti.textContent='⏳ Tour de '+(cur?cur.name:'?');ti.className='turn wait';}
  }
  document.getElementById('status-badge').textContent=isHost?'👑 Hôte':'';
  const table=document.getElementById('status-table');
  let ht=`<div class="st-row header"><span>Joueur</span><span style="text-align:right">Distance</span><span style="text-align:center">Statut</span><span style="text-align:center">Cartes</span></div>`;
  for(const p of gs.players){
    const isMe=p.id===pId,isCur=gs.players[gs.currentPlayer]&&gs.players[gs.currentPlayer].id===p.id;
    let stCl='sr',stTxt='✓';
    if(p.battlePile){stCl='st';stTxt=HI[p.battlePile]||'⚠️';}
    else if(p.speedPile){stCl='sl';stTxt='🚦';}
    else if(!p.battlePile&&!p.speedPile&&p.distance>0){stCl='sf';stTxt='🟢';}
    if((p.safeties||[]).length>0){stCl='sp';stTxt='🛡️';}
    if(p.isConnected===false){stCl='sr';stTxt='📴';}
    const cn=`st-row${isCur?' cur':''}${isMe?' me':''}`;
    ht+=`<div class="${cn}"><span class="st-name">${p.name}${isMe?' (toi)':''}</span><span class="st-dist">${p.distance||0}</span><span class="st-status"><span class="s ${stCl}">${stTxt}</span></span><span class="st-cards">${p.handSize||0}</span></div>`;
  }
  table.innerHTML=ht;

  document.getElementById('sname').textContent=me.name+(isHost?' 👑':'');
  document.getElementById('sdist').innerHTML=`${me.distance||0} <span>km</span>`;
  const st=document.getElementById('sstatus');
  const tags=[];
  if(me.battlePile)tags.push(`<span class="tag th">${HI[me.battlePile]||'⚠️'} ${me.battlePile.replace('_',' ')}</span>`);
  if(me.speedPile)tags.push(`<span class="tag tsp">🚦 Limité</span>`);
  (me.safeties||[]).forEach(s=>tags.push(`<span class="tag ts">${SI[s]||'🛡️'} ${s.replace('_',' ')}</span>`));
  st.innerHTML=tags.length?tags.join(''):'<span class="tag" style="color:#666">✓ En route</span>';
  document.getElementById('lmove').textContent=gs.lastMove?`⚡ ${gs.lastMove.player} : ${gs.lastMove.action}`:'';
  renderHand(me);
  updateBtns(me);
}

function renderHand(me){
  const h=document.getElementById('hand');
  if(!me||!me.hand||!me.hand.length){h.innerHTML='<div class="handempty">Aucune carte</div>';return;}
  h.innerHTML=me.hand.map((c,i)=>{
    const cl=cc(c),sl=selCard===i?' sel':'';
    return `<div class="card ${cl}${sl}" data-i="${i}"><div class="ci">${ci(c)}</div>${c.t==='dist'?`<div class="cv">${c.v}</div>`:''}<div class="cn">${dn(c)}</div></div>`;
  }).join('');
  h.querySelectorAll('.card').forEach(el=>{el.addEventListener('click',()=>showCardMenu(parseInt(el.dataset.i)))});
}

function showCardMenu(idx){
  if(!gs)return;
  const me=gs.players.find(p=>p.id===pId);
  if(!me||!me.hand||!me.hand[idx]||gs.players[gs.currentPlayer]?.id!==pId)return;
  const card=me.hand[idx];
  const canPlay = canPlayCardCheck(card, me);
  const d=document.createElement('div');d.className='cam';
  d.innerHTML=`<div class="c">
    <div class="ci">${ci(card)}</div>
    <div class="cn">${dn(card)}</div>
    <div class="ct">${card.t==='dist'?'Vitesse':card.t==='haz'?'Attaque':card.t==='rem'?'Défense':'Botte'}</div>
    <div class="ab">
      <button class="play" id="cplay"${canPlay?'':' disabled'}>▶ Jouer${canPlay?'':' (bloqué)'}</button>
      <button class="disc" id="cdisc">🗑 Jeter</button>
      <button class="cancel" id="ccancel">✕ Annuler</button>
    </div>
  </div>`;
  document.body.appendChild(d);
  d.querySelector('#cplay').addEventListener('click',()=>{
    if(card.t==='haz'){
      document.body.removeChild(d);
      showTargetSelect(card, (targetId)=>{
        ws.send(JSON.stringify({type:'play_card',cardIndex:idx,targetId}));
      });
      return;
    }
    ws.send(JSON.stringify({type:'play_card',cardIndex:idx}));
    document.body.removeChild(d);
  });
  d.querySelector('#cdisc').addEventListener('click',()=>{
    ws.send(JSON.stringify({type:'discard_card',cardIndex:idx}));
    document.body.removeChild(d);
  });
  d.querySelector('#ccancel').addEventListener('click',()=>document.body.removeChild(d));
}

function canPlayCardCheck(card, player){
  if(card.t==='dist') return !player.battlePile && !(player.speedPile&&card.v>50) && player.distance+card.v<=1000;
  if(card.t==='haz'){
    if(player.battlePile) return false;
    const targets=gs.players.filter(p=>p.id!==pId);
    return targets.some(p=>p.isConnected!==false && (card.s==='speed_limit'?!p.speedPile:!p.battlePile) && !((p.safeties||[]).some(s=>hm(card.s,s))));
  }
  if(card.t==='rem'){
    const h=card.s==='end_speed'?'speed_limit':card.s==='go'?'stop':card.s;
    return h==='speed_limit'?!!player.speedPile:player.battlePile===h;
  }
  if(card.t==='safe') return !player.safeties.includes(card.s);
  return false;
}

function showTargetSelect(card, onPick){
  const ot=gs.players.filter(p=>p.id!==pId);
  let h='<div class="target-overlay"><h3>🎯 Choisis une cible</h3>';
  ot.forEach(p=>{
    let dis=false,w='';
    if(p.isConnected===false){dis=true;w='Déco'}
    else if(card.s==='speed_limit'&&p.speedPile){dis=true;w='Déjà limité'}
    else if(card.s!=='speed_limit'&&p.battlePile){dis=true;w='Pas démarré/bloqué'}
    else if((p.safeties||[]).some(s=>hm(card.s,s))){dis=true;w='Protégé'}
    h+=`<div class="target-opp${dis?' disabled':''}" data-id="${p.id}">${p.name} ${w?'— '+w:''}</div>`;
  });
  h+=`<button class="target-cancel">Annuler</button></div>`;
  const d=document.createElement('div');d.innerHTML=h;document.body.appendChild(d);
  d.querySelectorAll('.target-opp:not(.disabled)').forEach(el=>{el.addEventListener('click',()=>{
    document.body.removeChild(d);
    if(onPick)onPick(el.dataset.id);
  })});
  d.querySelector('.target-cancel').addEventListener('click',()=>document.body.removeChild(d));
}

function updateBtns(me){
  const eb=document.getElementById('endb');
  const myTurn=gs&&gs.players[gs.currentPlayer]?.id===pId;
  eb.disabled=!myTurn;
}

function showR(wid){
  S('results');
  if(!gs)return;
  const wp=gs.players.find(p=>p.id===wid);
  document.getElementById('wname').textContent=wp?wp.name:'?';
  const sorted=[...gs.players].sort((a,b)=>b.distance-a.distance);
  document.getElementById('fscores').innerHTML=sorted.map((p,i)=>`<div class="r"><span class="pos">#${i+1}</span><span>${p.name}</span><span>${p.distance||0} km</span></div>`).join('');
}

// ===================== EVENTS =====================
document.getElementById('create-btn').addEventListener('click',()=>{
  myName=document.getElementById('name').value.trim()||'Joueur';
  if(!ws||ws.readyState!==1){E('Connexion...');return;}
  ws.send(JSON.stringify({type:'create_room',playerName:myName, maxPlayers: MAX_PLAYERS}));
});

document.getElementById('join-btn').addEventListener('click',()=>{
  myName=document.getElementById('name').value.trim()||'Joueur';
  const code=document.getElementById('jcode').value.trim().toUpperCase();
  if(!code||code.length<4)return E('Entre un code à 4 lettres');
  if(!ws||ws.readyState!==1){E('Connexion...');return;}
  ws.send(JSON.stringify({type:'join_room',roomId:code,playerName:myName}));
});

document.getElementById('name').value=gn();
document.getElementById('jcode').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('join-btn').click()});
document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('create-btn').click()});

document.getElementById('start-btn').addEventListener('click',()=>{
  if(ws)ws.send(JSON.stringify({type:'start_game'}));
});

document.getElementById('leave-btn').addEventListener('click',()=>{myRoom='';isHost=false;S('lobby')});
document.getElementById('copyhint').addEventListener('click',()=>{
  navigator.clipboard.writeText(document.getElementById('rcode').textContent);
  document.getElementById('copyhint').textContent='✅ Copié';
  setTimeout(()=>document.getElementById('copyhint').textContent='📋 Copier',2000);
});

document.getElementById('endb').addEventListener('click',()=>{
  if(ws)ws.send(JSON.stringify({type:'end_turn'}));
});

document.getElementById('replay-btn').addEventListener('click',()=>{S('waiting')});

connect();
</script>
</body>
</html>
